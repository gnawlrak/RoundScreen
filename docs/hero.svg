<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">RoundScreen</title>
  <desc id="desc">Continuous-curvature corners for every macOS display, without replacing native system behavior.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090d"/>
      <stop offset=".55" stop-color="#0d1118"/>
      <stop offset="1" stop-color="#151a24"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#6ea8ff" stop-opacity=".24"/>
      <stop offset="1" stop-color="#6ea8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121826"/>
      <stop offset="1" stop-color="#070a10"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9d7ff" stop-opacity=".8"/>
      <stop offset=".5" stop-color="#6b7d98" stop-opacity=".24"/>
      <stop offset="1" stop-color="#d9e8ff" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7db2ff"/>
      <stop offset="1" stop-color="#b8ffcf"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#000000" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="1260" cy="250" rx="430" ry="320" fill="url(#glow)"/>
  <ellipse cx="1080" cy="760" rx="330" ry="170" fill="#8cffc0" opacity=".045" filter="url(#softGlow)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Helvetica Neue', sans-serif">
    <g transform="translate(96 132)">
      <rect width="350" height="38" rx="19" fill="#ffffff" fill-opacity=".055" stroke="#ffffff" stroke-opacity=".12"/>
      <text x="24" y="25" fill="#b9c8dc" font-size="15" font-weight="600" letter-spacing="1.6">macOS 14+ · SWIFT 6 · MIT</text>
    </g>

    <text x="92" y="278" fill="#f6f9ff" font-size="92" font-weight="700" letter-spacing="-4">RoundScreen</text>

    <text x="96" y="354" fill="#c8d5e7" font-size="28" font-weight="500">把 MacBook Pro / Pro Display XDR 的</text>
    <text x="96" y="396" fill="#c8d5e7" font-size="28" font-weight="500">连续曲率四角，带到每一块 macOS 显示器。</text>

    <text x="96" y="466" fill="#8292a8" font-size="19">不替换系统窗口管理，不修改系统文件。</text>
    <text x="96" y="496" fill="#8292a8" font-size="19">原生全屏、调度中心、锁屏、多桌面与触发角继续工作。</text>

    <g transform="translate(96 554)">
      <g>
        <rect width="132" height="50" rx="14" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".1"/>
        <circle cx="22" cy="25" r="4" fill="#8db8ff"/>
        <text x="38" y="31" fill="#dce8f8" font-size="16" font-weight="600">20 pt 正常</text>
      </g>
      <g transform="translate(148 0)">
        <rect width="146" height="50" rx="14" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".1"/>
        <circle cx="22" cy="25" r="4" fill="#ffc27a"/>
        <text x="38" y="31" fill="#dce8f8" font-size="16" font-weight="600">14 pt 最大化</text>
      </g>
      <g transform="translate(310 0)">
        <rect width="132" height="50" rx="14" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".1"/>
        <circle cx="22" cy="25" r="4" fill="#8dffb7"/>
        <text x="38" y="31" fill="#dce8f8" font-size="16" font-weight="600">0 pt 全屏</text>
      </g>
    </g>

    <text x="96" y="788" fill="#617086" font-size="15">Inspired by continuous-curvature display corners.</text>
    <text x="96" y="818" fill="#4b5668" font-size="13">Independent project. Not affiliated with or endorsed by Apple Inc.</text>

    <g transform="translate(842 144)" filter="url(#shadow)">
      <rect x="0" y="0" width="650" height="560" rx="42" fill="#05070b" stroke="url(#edge)" stroke-width="2"/>
      <rect x="10" y="10" width="630" height="540" rx="34" fill="url(#screen)"/>

      <path d="M44 10h562c16 0 24 8 24 24v24H20V34c0-16 8-24 24-24Z" fill="#ffffff" fill-opacity=".055"/>
      <circle cx="44" cy="34" r="6" fill="#ff6b6b" opacity=".9"/>
      <circle cx="64" cy="34" r="6" fill="#ffd166" opacity=".9"/>
      <circle cx="84" cy="34" r="6" fill="#6bff9d" opacity=".9"/>
      <text x="116" y="40" fill="#8b9ab0" font-size="15" font-family="'SF Mono', 'Menlo', monospace">RoundScreen — continuous corners</text>

      <g transform="translate(42 92)">
        <rect width="258" height="336" rx="18" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".08"/>
        <rect x="18" y="20" width="118" height="10" rx="5" fill="#8db8ff" opacity=".8"/>
        <rect x="18" y="48" width="210" height="8" rx="4" fill="#ffffff" opacity=".12"/>
        <rect x="18" y="70" width="182" height="8" rx="4" fill="#ffffff" opacity=".08"/>
        <rect x="18" y="104" width="222" height="1" fill="#ffffff" opacity=".08"/>
        <rect x="18" y="128" width="86" height="8" rx="4" fill="#ffc27a" opacity=".72"/>
        <rect x="18" y="154" width="196" height="8" rx="4" fill="#ffffff" opacity=".1"/>
        <rect x="18" y="176" width="164" height="8" rx="4" fill="#ffffff" opacity=".08"/>
        <rect x="18" y="198" width="204" height="8" rx="4" fill="#ffffff" opacity=".08"/>
        <rect x="18" y="238" width="128" height="10" rx="5" fill="#8dffb7" opacity=".72"/>
        <rect x="18" y="264" width="212" height="8" rx="4" fill="#ffffff" opacity=".1"/>
        <rect x="18" y="286" width="190" height="8" rx="4" fill="#ffffff" opacity=".07"/>
      </g>

      <g transform="translate(326 92)">
        <rect width="282" height="336" rx="18" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".09"/>
        <rect x="20" y="22" width="242" height="96" rx="12" fill="#0a0f18" stroke="#ffffff" stroke-opacity=".08"/>
        <rect x="36" y="42" width="104" height="9" rx="4.5" fill="#8db8ff" opacity=".82"/>
        <rect x="36" y="66" width="188" height="7" rx="3.5" fill="#ffffff" opacity=".13"/>
        <rect x="36" y="86" width="154" height="7" rx="3.5" fill="#ffffff" opacity=".09"/>
        <circle cx="238" cy="44" r="10" fill="#8dffb7" opacity=".25"/>
        <circle cx="238" cy="44" r="4" fill="#8dffb7"/>

        <rect x="20" y="142" width="242" height="152" rx="12" fill="#0a0f18" stroke="#ffffff" stroke-opacity=".08"/>
        <text x="36" y="170" fill="#6e7f96" font-size="12" font-family="'SF Mono', 'Menlo', monospace">screen.corners</text>
        <text x="36" y="198" fill="#b9d7ff" font-size="13" font-family="'SF Mono', 'Menlo', monospace">normal      = 20 pt</text>
        <text x="36" y="222" fill="#ffc27a" font-size="13" font-family="'SF Mono', 'Menlo', monospace">maximized   = 14 pt</text>
        <text x="36" y="246" fill="#8dffb7" font-size="13" font-family="'SF Mono', 'Menlo', monospace">fullscreen  =  0 pt</text>
        <rect x="36" y="266" width="170" height="6" rx="3" fill="#ffffff" opacity=".08"/>
        <rect x="36" y="266" width="118" height="6" rx="3" fill="url(#accent)" opacity=".7"/>
      </g>

      <g transform="translate(118 492)">
        <rect width="414" height="46" rx="23" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".12"/>
        <circle cx="34" cy="23" r="9" fill="#8db8ff" opacity=".8"/>
        <circle cx="64" cy="23" r="9" fill="#ffffff" opacity=".18"/>
        <circle cx="94" cy="23" r="9" fill="#ffffff" opacity=".18"/>
        <circle cx="124" cy="23" r="9" fill="#ffc27a" opacity=".7"/>
        <circle cx="154" cy="23" r="9" fill="#ffffff" opacity=".18"/>
        <circle cx="184" cy="23" r="9" fill="#8dffb7" opacity=".7"/>
        <rect x="214" y="8" width="1" height="30" fill="#ffffff" opacity=".1"/>
        <circle cx="248" cy="23" r="9" fill="#ffffff" opacity=".18"/>
        <circle cx="278" cy="23" r="9" fill="#ffffff" opacity=".18"/>
        <circle cx="308" cy="23" r="9" fill="#ffffff" opacity=".18"/>
        <circle cx="338" cy="23" r="9" fill="#ffffff" opacity=".18"/>
        <circle cx="368" cy="23" r="9" fill="#ffffff" opacity=".18"/>
      </g>
    </g>

    <g transform="translate(1188 92)">
      <rect width="184" height="48" rx="14" fill="#0e1722" stroke="#8db8ff" stroke-opacity=".32"/>
      <text x="18" y="30" fill="#b9d7ff" font-size="15" font-weight="600">20 pt · Normal</text>
    </g>
    <g transform="translate(1282 744)">
      <rect width="188" height="48" rx="14" fill="#0e1722" stroke="#ffc27a" stroke-opacity=".3"/>
      <text x="18" y="30" fill="#ffd39b" font-size="15" font-weight="600">14 pt · Maximized</text>
    </g>
    <g transform="translate(1040 744)">
      <rect width="206" height="48" rx="14" fill="#0e1722" stroke="#8dffb7" stroke-opacity=".3"/>
      <text x="18" y="30" fill="#a9ffc8" font-size="15" font-weight="600">0 pt · Fullscreen</text>
    </g>

    <path d="M810 188c-14 0-24 10-24 24v18" fill="none" stroke="#8db8ff" stroke-opacity=".55" stroke-width="2"/>
    <path d="M1500 676c14 0 24-10 24-24v-18" fill="none" stroke="#ffc27a" stroke-opacity=".5" stroke-width="2"/>
    <path d="M810 676c-14 0-24-10-24-24v-18" fill="none" stroke="#8dffb7" stroke-opacity=".5" stroke-width="2"/>
  </g>
</svg>
