name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run tests
        run: |
          xcodebuild -project RoundScreen.xcodeproj -scheme RoundScreen \
            -configuration Debug -derivedDataPath .build/DerivedData \
            -destination 'platform=macOS' test CODE_SIGNING_ALLOWED=NO
