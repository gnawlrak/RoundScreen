name: RoundScreen

options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_APP_SANDBOX: NO
    CODE_SIGN_STYLE: Automatic

targets:
  RoundScreenCore:
    type: framework
    platform: macOS
    sources:
      - Sources/RoundScreenCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gnawlrak.RoundScreenCore
        PRODUCT_NAME: RoundScreenCore
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES

  RoundScreen:
    type: application
    platform: macOS
    sources:
      - Sources/RoundScreen
    info:
      path: Sources/RoundScreen/Info.plist
      properties:
        CFBundleDisplayName: RoundScreen
        CFBundleShortVersionString: "1.0.1"
        CFBundleVersion: "2"
        LSMinimumSystemVersion: "14.0"
        LSUIElement: true
        NSHighResolutionCapable: true
    dependencies:
      - target: RoundScreenCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gnawlrak.RoundScreen
        PRODUCT_NAME: RoundScreen
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "2"

  RoundScreenCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/RoundScreenCoreTests
    dependencies:
      - target: RoundScreenCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gnawlrak.RoundScreenCoreTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  RoundScreen:
    build:
      targets:
        RoundScreen: all
        RoundScreenCoreTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - RoundScreenCoreTests
    archive:
      config: Release
